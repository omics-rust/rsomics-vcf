name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: macos-x86_64
            runner: macos-15-intel
          - target: macos-aarch64
            runner: macos-15

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: clippy,rustfmt

      - name: Format
        if: matrix.target == 'linux-x86_64'
        run: cargo fmt --all -- --check

      - name: Strict Clippy
        if: matrix.target == 'linux-x86_64'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test debug
        run: cargo test --locked --all-features

      - name: Test release
        run: cargo test --release --locked --all-features

      - name: Verify package
        if: matrix.target == 'linux-x86_64'
        run: cargo package --locked

      - name: Install bcftools oracle dependencies
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbz2-dev libcurl4-openssl-dev liblzma-dev libssl-dev zlib1g-dev

      - name: Build bcftools 1.24 oracle
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/bcftools-1.24.tar.bz2"
          curl --fail --location --retry 3 \
            https://github.com/samtools/bcftools/releases/download/1.24/bcftools-1.24.tar.bz2 \
            --output "$archive"
          echo "8caddc22610ee2851666047c859bb91da0c1e32d0c2ec553db6f153ad130e46f  $archive" \
            | shasum -a 256 --check
          tar -xjf "$archive" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/bcftools-1.24"
          ./configure --without-curses
          make -j2
          echo "$RUNNER_TEMP/bcftools-1.24" >> "$GITHUB_PATH"

      - name: Verify bcftools oracle
        if: matrix.target == 'linux-x86_64'
        run: test "$(bcftools --version | sed -n '1p')" = "bcftools 1.24"

      - name: Fetch pinned validation corpora
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          hts="$RUNNER_TEMP/hts-specs"
          git init "$hts"
          git -C "$hts" remote add origin https://github.com/samtools/hts-specs.git
          git -C "$hts" fetch --depth=1 origin da617203a9527537746e200abda2885bec3a822c
          git -C "$hts" checkout --detach FETCH_HEAD
          test "$(git -C "$hts" rev-parse HEAD)" = da617203a9527537746e200abda2885bec3a822c

          validator="$RUNNER_TEMP/vcf-validator"
          git init "$validator"
          git -C "$validator" remote add origin https://github.com/EBIvariation/vcf-validator.git
          git -C "$validator" fetch --depth=1 origin 0aacc4a44430ab9cee87d9925aacb28a2fb0a9fb
          git -C "$validator" checkout --detach FETCH_HEAD
          test "$(git -C "$validator" rev-parse HEAD)" = 0aacc4a44430ab9cee87d9925aacb28a2fb0a9fb

          echo "HTS_SPECS_DIR=$hts" >> "$GITHUB_ENV"
          echo "VCF_VALIDATOR_DIR=$validator" >> "$GITHUB_ENV"

      - name: Test compatibility oracle
        if: matrix.target == 'linux-x86_64'
        run: |
          cargo test --locked --test compat -- --ignored
          cargo test --locked --test filter_compat -- --ignored
          cargo test --locked --test index_compat -- --ignored
          cargo test --locked --all-features --test norm_compat -- --ignored
          cargo test --locked --test query -- --ignored
          cargo test --locked --test validate_compat -- --ignored
          cargo test --locked --test view_compat -- --ignored
